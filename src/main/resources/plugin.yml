name: MorniVersteckerl
version: '${project.version}'
main: net.morni.versteckerl.VersteckerlPlugin
api-version: '1.21'
description: Versteckerl für das Netzwerk morni.net – Verstecken mit Verwandlung, 4 bis 16 Leute.
authors: [morni.net]
website: https://morni.net
# Läuft mit dem Netzwerk-Plugin (Sprache, Party, Statistik) und auch allein.
softdepend: [MorniNet]

commands:
  versteckerladmin:
    description: Verwaltung und Tests (info, status, start, zeit, sucher, ende, neubauen, neuladen)
    usage: /versteckerladmin <info|status|start [karte]|zeit <sekunden> [karte]|sucher <namen…|weg>|ende [karte]|neubauen|neuladen>
    aliases: [vkadmin]
    permission: morninet.versteckerl.admin
  karte:
    description: Über die Karte abstimmen
    usage: /karte [dorfplatz|wirtshaus|heustadel]
    aliases: [map, vote]
  bereit:
    description: In der Gendarmerie bereit melden
    usage: /bereit
    aliases: [ready]
  gestalt:
    description: Gestalt wählen (in der Versteckzeit, danach einmal wechseln)
    usage: /gestalt
    aliases: [shape, form]
  zuschauen:
    description: Einer Runde zuschauen
    usage: /zuschauen [spieler|karte]
    aliases: [spectate, spec]
  verlassen:
    description: Runde oder Zuschauen verlassen (zurück in die Gendarmerie)
    usage: /verlassen
    aliases: [leave]
  stats:
    description: Statistik ansehen
    usage: /stats [spieler]
    aliases: [statistik]
  top:
    description: Steckbriefe – die Besten
    usage: /top
    aliases: [bestenliste, leaderboard]

permissions:
  morninet.versteckerl.admin:
    description: Versteckerl verwalten und im Kreativmodus in der Versteckerl-Welt bauen
    default: op
